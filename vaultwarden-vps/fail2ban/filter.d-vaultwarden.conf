# ============================================================================
#  fail2ban-Filter: fehlgeschlagene Anmeldungen an Vaultwarden
#
#  Ablage auf dem Host:
#      /etc/fail2ban/filter.d/vaultwarden.conf
#
#  Passende Logzeilen (Vaultwarden mit EXTENDED_LOGGING=true):
#    [2026-08-11 10:15:42.123][vaultwarden::api::identity][ERROR] Username or
#      password is incorrect. Try again. IP: 203.0.113.9. Username: max@example.de.
#    [2026-08-11 10:16:03.451][vaultwarden::api::core::two_factor::authenticator]
#      [ERROR] Invalid TOTP code! Server time: ... IP: 203.0.113.9
#
#  Test:
#    fail2ban-regex /pfad/vw-data/vaultwarden.log /etc/fail2ban/filter.d/vaultwarden.conf
# ============================================================================

[INCLUDES]
before = common.conf

[Definition]

failregex = ^.*?Username or password is incorrect\. Try again\.( IP: <ADDR>\.)? Username:.*$
            ^.*?Username or password is incorrect\. Try again\. IP: <ADDR>.*$
            ^.*?Invalid TOTP code.*IP: <ADDR>.*$
            ^.*?Username or e-?mail address is incorrect.*IP: <ADDR>.*$

ignoreregex =

# Vaultwarden schreibt einen eigenen Zeitstempel in eckigen Klammern.
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S

[Init]
# Auch mehrzeilige Umbrueche im Log sicher erfassen
maxlines = 2
