# ============================================================================
#  fail2ban-Filter: fehlgeschlagene Anmeldungen am Admin-Panel (/admin)
#
#  Ablage auf dem Host:
#      /etc/fail2ban/filter.d/vaultwarden-admin.conf
#
#  Passende Logzeile:
#    [2026-08-11 10:20:11.987][vaultwarden::api::admin][ERROR] Invalid admin token.
#      IP: 203.0.113.9
# ============================================================================

[INCLUDES]
before = common.conf

[Definition]

failregex = ^.*?Invalid admin token\.? IP: <ADDR>.*$
            ^.*?Invalid admin token.*IP: <ADDR>.*$

ignoreregex =

datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S

[Init]
maxlines = 2
